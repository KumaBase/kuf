[package]
name = "kuf"
version = "0.4.2"
edition = "2021"

[lib]
name = "kuf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
toml = "0.8"
russh = "0.49"
russh-keys = "0.49"
russh-sftp = "2"
async-trait = "0.1"
fs4 = "0.13"
tokio = { version = "1", features = ["rt", "sync", "rt-multi-thread", "macros", "io-util", "net", "fs"] }
rfd = "0.15"
notify = "8.2"
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
base64 = "0.22.1"
hmac = "0.12"
sha1 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[target.'cfg(not(windows))'.dependencies]
trash = "5.2"
libc = "0.2"
